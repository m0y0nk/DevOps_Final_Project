# ==============================================================================
# Prometheus Community kube-prometheus-stack values
# Installed via: helm upgrade --install prometheus prometheus-community/kube-prometheus-stack \
#   -n monitoring --create-namespace -f monitoring/prometheus-values.yaml
# ==============================================================================

# Disable components not needed for this demo
alertmanager:
  enabled: false

# Prometheus configuration
prometheus:
  enabled: true
  prometheusSpec:
    scrapeInterval: 15s
    evaluationInterval: 15s
    # Allow scraping ServiceMonitors from all namespaces (picks up labtrack)
    serviceMonitorSelectorNilUsesHelmValues: false
    serviceMonitorSelector: {}
    serviceMonitorNamespaceSelector: {}
    retention: 24h
    emptyDir: {}
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi

# Grafana configuration
grafana:
  enabled: true
  adminPassword: "labtrack-grafana-2024"
  service:
    type: LoadBalancer
  persistence:
    enabled: false
  resources:
    requests:
      cpu: 100m
      memory: 200Mi
    limits:
      cpu: 500m
      memory: 512Mi

nodeExporter:
  enabled: false

kubeStateMetrics:
  enabled: true

prometheusOperator:
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi
