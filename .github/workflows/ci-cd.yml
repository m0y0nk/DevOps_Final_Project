name: LabTrack CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  REGISTRY: ghcr.io

jobs:
  # -------------------------------------------------------------
  # Stage 1: Tests (Pytest + Frontend Build)
  # -------------------------------------------------------------
  test:
    name: Run Automated Tests & Build Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Pytest Suite
        run: |
          cd backend
          pytest -v

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package.json

      - name: Install Frontend Dependencies & Build
        run: |
          cd frontend
          npm install
          npm run build

  # -------------------------------------------------------------
  # Stage 2 & 3: Container Build & Trivy Security Scan
  # -------------------------------------------------------------
  build-and-scan:
    name: Build Images & Run Trivy Security Scan
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set lowercase repository names
        run: |
          OWNER_LC=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "IMAGE_BACKEND=ghcr.io/${OWNER_LC}/labtrack-backend" >> $GITHUB_ENV
          echo "IMAGE_FRONTEND=ghcr.io/${OWNER_LC}/labtrack-frontend" >> $GITHUB_ENV
          echo "SHORT_SHA=$(git rev-parse --short HEAD)" >> $GITHUB_ENV

      - name: Build Backend Image (Local Tar for Scan)
        run: |
          docker build -t ${{ env.IMAGE_BACKEND }}:${{ env.SHORT_SHA }} ./backend
          docker save -o backend-image.tar ${{ env.IMAGE_BACKEND }}:${{ env.SHORT_SHA }}

      - name: Build Frontend Image (Local Tar for Scan)
        run: |
          docker build -t ${{ env.IMAGE_FRONTEND }}:${{ env.SHORT_SHA }} ./frontend
          docker save -o frontend-image.tar ${{ env.IMAGE_FRONTEND }}:${{ env.SHORT_SHA }}

      # DevSecOps Gate: Scan Backend Image
      - name: Run Trivy Scan on Backend Image
        uses: aquasecurity/trivy-action@master
        with:
          input: backend-image.tar
          format: "table"
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: "os,library"
          severity: "CRITICAL,HIGH"

      # DevSecOps Gate: Scan Frontend Image
      - name: Run Trivy Scan on Frontend Image
        uses: aquasecurity/trivy-action@master
        with:
          input: frontend-image.tar
          format: "table"
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: "os,library"
          severity: "CRITICAL,HIGH"

  # -------------------------------------------------------------
  # Stage 4: Publish Immutable SHA Images to GHCR
  # -------------------------------------------------------------
  publish:
    name: Publish SHA-Tagged Images to GHCR
    needs: build-and-scan
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set Image Names and Tags
        run: |
          OWNER_LC=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "IMAGE_BACKEND=ghcr.io/${OWNER_LC}/labtrack-backend" >> $GITHUB_ENV
          echo "IMAGE_FRONTEND=ghcr.io/${OWNER_LC}/labtrack-frontend" >> $GITHUB_ENV
          echo "SHORT_SHA=$(git rev-parse --short HEAD)" >> $GITHUB_ENV

      - name: Build and Push Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.IMAGE_BACKEND }}:${{ env.SHORT_SHA }}
            ${{ env.IMAGE_BACKEND }}:latest

      - name: Build and Push Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ env.IMAGE_FRONTEND }}:${{ env.SHORT_SHA }}
            ${{ env.IMAGE_FRONTEND }}:latest
