apiVersion: v1
kind: Secret
metadata:
  name: {{ include "labtrack.fullname" . }}-db-secret
  labels:
    {{- include "labtrack.labels" . | nindent 4 }}
type: Opaque
stringData:
  POSTGRES_DB: {{ .Values.postgresql.auth.database | quote }}
  POSTGRES_USER: {{ .Values.postgresql.auth.username | quote }}
  POSTGRES_PASSWORD: {{ .Values.postgresql.auth.password | quote }}
  DATABASE_URL: "postgresql+psycopg://{{ .Values.postgresql.auth.username }}:{{ .Values.postgresql.auth.password }}@{{ include "labtrack.fullname" . }}-postgresql:5432/{{ .Values.postgresql.auth.database }}"
